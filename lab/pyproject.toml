[project]
name = "techtree-lab"
version = "0.1.0"
description = "Techtree's lab: the payment-terms environment, its runner, and the Train comparison reports"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Techtree" }]
dependencies = [
  "payment-terms",
  "rfc8785==0.1.4",
  "rich>=15.0.0,<16",
  "tomli-w>=1.2.0,<2",
  "verifiers==0.4.1",
]

[project.scripts]
techtree-lab = "techtree_lab.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.170,<7",
  "mypy>=2.4.1,<3",
  "pytest>=9.2.0,<10",
  "ruff>=0.17.4,<1",
]
prime = ["prime==0.20.3"]

[tool.uv]
default-groups = ["dev", "prime"]

[tool.uv.sources]
payment-terms = { path = "environments/payment_terms", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techtree_lab"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["techtree_lab", "payment_terms"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "environments/payment_terms/payment_terms", "tests"]

[[tool.mypy.overrides]]
module = ["verifiers", "verifiers.*", "toml", "prime_cli.*"]
ignore_missing_imports = true

# verifiers ships no type information, so its classes and decorators are untyped here.
[[tool.mypy.overrides]]
module = ["payment_terms.taskset"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:typer"]
