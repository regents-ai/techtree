name: Publish to PyPI

# Gate-2 publication only. Trusted publishing (OIDC) — no tokens.
# The workflow rebuilds the wheel from the approved tag (builds are
# byte-reproducible) and refuses to publish unless the fresh build's
# SHA-256 equals the digest named in the founder's approval packet.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The approved release tag (e.g. v0.1.0)"
        required: true
        type: string
      expected_sha256:
        description: "The wheel SHA-256 from the approved Gate-2 packet (64 hex chars, no prefix)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v5

      - name: Build the wheel from the approved tag
        run: uv build --wheel

      - name: Refuse to publish anything but the approved bytes
        run: |
          set -euo pipefail
          built=$(sha256sum dist/*.whl | awk '{print $1}')
          echo "built:    $built"
          echo "approved: ${{ inputs.expected_sha256 }}"
          if [ "$built" != "${{ inputs.expected_sha256 }}" ]; then
            echo "The freshly built wheel does not match the approved digest. Nothing was published."
            exit 1
          fi
          stamped=$(python3 -c "import zipfile,json;print(json.loads(zipfile.ZipFile([p for p in __import__('glob').glob('dist/*.whl')][0]).read('techtree/resources/release/build-provenance.json'))['source_commit'])")
          echo "stamped source commit: $stamped"
          if [ "$stamped" != "$(git rev-parse HEAD)" ]; then
            echo "The wheel's provenance stamp does not name the checked-out commit. Nothing was published."
            exit 1
          fi

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
