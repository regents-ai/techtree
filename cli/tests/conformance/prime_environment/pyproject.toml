[project]
name = "techtree-v02-conformance"
version = "0.1.0"
description = "Deterministic infrastructure-conformance environment for Techtree v0.2"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["verifiers==0.3.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["techtree_v02_conformance"]
