[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
verbosity = 2
threads = 1
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"
number_underscore = "thousands"
