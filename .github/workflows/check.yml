name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: CLI and Hermes plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check CLI
        working-directory: cli
        run: make check
      - name: Check plugin package
        working-directory: plugin
        run: make check
      - name: Check CLI and plugin integration
        working-directory: cli
        run: make check-plugin

  platform:
    name: Public platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      MIX_TEST_PARTITION: _github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.19.5
          otp-version: 28.3.1
      - name: Install dependencies
        working-directory: platform
        run: mix deps.get
      - name: Build assets
        working-directory: platform
        run: mix assets.setup && mix assets.build
      - name: Check platform
        working-directory: platform
        run: mix check

  contracts:
    name: Registry contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Materialize Solidity compiler
        working-directory: contracts
        run: forge build
      - name: Check contracts offline
        run: make check-contracts
