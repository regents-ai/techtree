\* No release when a lease expires, liveness only. Expected: EveryReservationEnds
\* violated (a crashed agent's reservation is never given back).
SPECIFICATION Spec
CONSTANTS
  NumAgents = 3
  NumTasks = 2
  MaxEpoch = 2
  Limit = 1
  AtomicAdmit = TRUE
  Idempotent = TRUE
  ReleaseOnExpiry = FALSE
INVARIANTS TypeOK
PROPERTY EveryReservationEnds
CHECK_DEADLOCK FALSE
