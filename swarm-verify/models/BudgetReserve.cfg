\* All three rules: 3 agents, 2 tasks, 2 leases per task, a limit of 1 unit.
\* Expected: no violation, and every reservation is eventually spent or given back.
SPECIFICATION Spec
CONSTANTS
  NumAgents = 3
  NumTasks = 2
  MaxEpoch = 2
  Limit = 1
  AtomicAdmit = TRUE
  Idempotent = TRUE
  ReleaseOnExpiry = TRUE
INVARIANTS TypeOK WithinLimit OnePerLease NoReservationOutlivesLease LeaseSafe
PROPERTY EveryReservationEnds
CHECK_DEADLOCK FALSE
