\* Calls not keyed by lease, limit 2. Expected: OnePerLease violated (a retry
\* reserves twice).
SPECIFICATION Spec
CONSTANTS
  NumAgents = 3
  NumTasks = 2
  MaxEpoch = 2
  Limit = 2
  AtomicAdmit = TRUE
  Idempotent = FALSE
  ReleaseOnExpiry = TRUE
INVARIANTS TypeOK WithinLimit OnePerLease NoReservationOutlivesLease LeaseSafe
CHECK_DEADLOCK FALSE
